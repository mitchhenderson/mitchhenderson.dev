# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Hook for post-only styles (reading progress line)
body-classes: post-page

# Table of contents sits in the right margin so the text stays centred
toc: true
toc-title: On this page
toc-location: right

# Flags pre-2024 posts as archived, lets figures and tables run wider than
# the text, and names the R / Python logos used as tab labels
filters:
  - archive-note.lua
  - reading-layout.lua
  - alt-text.lua

# Click a figure to see it full size
lightbox: true

# Page-level R / Python switch and the small-screen contents list
include-after-body: post-enhancements.html

# Giscus comments
comments:
  giscus:
    repo:  mitchhenderson/mitchhenderson.dev
    repo-id: "R_kgDOJLIMQQ"
    category: "Announcements"
    category-id: "DIC_kwDOJLIMQc4CU9Pb"
    mapping: "pathname"
    reactions-enabled: true
    loading: lazy
    input-position: "bottom"
    theme:
      light: light
      dark: dark_dimmed
